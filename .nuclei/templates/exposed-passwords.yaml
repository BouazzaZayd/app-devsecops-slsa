id: exposed-admin-users-passwords
info:
  name: Mots de passe en clair exposes sur /admin/users
  author: lab
  severity: critical
  tags: exposure,owasp
http:
  - method: GET
    path:
      - "{{BaseURL}}/admin/users"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "password"
