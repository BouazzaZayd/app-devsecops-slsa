# Pipeline securise complet -> build -> provenance SLSA -> SBOM -> signature keyless
# Etape 1 : ajout des analyses statiques (SAST, SCA, secrets) en gate bloquant.
# (La provenance passera en SLSA L3 a l'etape 2.)
name: release

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions: {}

env:
  COSIGN_VERSION: v3.1.1

jobs:
  # ---------- Analyses statiques (gate bloquant, comme le pipeline Gitea) ----------
  sast-semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Analyse statique Semgrep (SAST)
        run: semgrep scan --config auto --error --no-git-ignore

  sca-trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit des dependances Trivy (SCA)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # historique complet : TruffleHog scanne aussi le passe
          persist-credentials: false
      - name: Detection de secrets TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --results=verified,unknown --fail

  # ---------- Build + provenance + SBOM + signature keyless ----------
  build-sign-attest:
    runs-on: ubuntu-latest
    needs: [sast-semgrep, sca-trivy, secret-scan]   # gate : build seulement si les scans passent
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.img.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout (sans credentials persistants)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Nom d'image en minuscules
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Connexion a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags et labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build et push (le digest devient le sujet unique de tout le reste)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false

      - name: Provenance SLSA (native GitHub, niveau L2 - remplacee en L3 a l'etape 2)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.img.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generation du SBOM (Syft, CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.img.outputs.name }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attestation du SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ steps.img.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      - name: Installation de Cosign (meme methode et version que le TD, CT2)
        run: |
          curl -sSfL -o /usr/local/bin/cosign \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          sudo chmod +x /usr/local/bin/cosign
          cosign version

      - name: Signature keyless (Fulcio + Rekor), par digest
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Resume pour le verificateur
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Image publiee"
            echo "- Reference : ${IMAGE}@${DIGEST}"
            echo "- Identite attendue : https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
            echo "- Emetteur OIDC : https://token.actions.githubusercontent.com"
          } >> "$GITHUB_STEP_SUMMARY"
